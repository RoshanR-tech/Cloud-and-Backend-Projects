<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Classifier</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{
            width:700px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:40px;
            text-align:center;
            color:white;
            box-shadow:0 10px 40px rgba(0,0,0,.4);
        }

        h1{
            font-size:38px;
            margin-bottom:10px;
        }

        p{
            color:#d1d5db;
            margin-bottom:30px;
        }

        input[type=file]{
            width:100%;
            padding:15px;
            border-radius:10px;
            border:2px dashed #22c55e;
            background:#1f2937;
            color:white;
            cursor:pointer;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#22c55e;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#16a34a;
            transform:scale(1.02);
        }

        img{
            width:350px;
            margin-top:30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
        }

        .result{
            margin-top:30px;
            background:#1e293b;
            border-radius:15px;
            padding:25px;
            text-align:left;
        }

        .result h2{
            text-align:center;
            margin-bottom:25px;
        }

        .prediction-row{
            margin-bottom:20px;
        }

        .prediction-header{
            display:flex;
            justify-content:space-between;
            margin-bottom:8px;
            font-size:18px;
        }

        .bar{
            width:100%;
            height:18px;
            background:#374151;
            border-radius:20px;
            overflow:hidden;
        }

        .fill{
            height:100%;
            background:#22c55e;
            transition:width .8s ease;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Image Classifier</h1>

    <p>Upload an image and let AI identify what's inside it.</p>

    <form action="/predict" method="post" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <button type="submit">
            ✨ Predict Image
        </button>

    </form>

    {% if image %}

        <img src="{{ image }}" alt="Uploaded Image">

        <div class="result">

            <h2>🏆 Top 5 Predictions</h2>

            {% for prediction in predictions %}

                <div class="prediction-row">

                    <div class="prediction-header">
                        <span>🤖 {{ prediction.label }}</span>
                        <span>{{ prediction.confidence }}%</span>
                    </div>

                    <div class="bar">
                        <div
                            class="fill"
                            style="width: {{ prediction.confidence }}%;">
                        </div>
                    </div>

                </div>

            {% endfor %}

        </div>

    {% endif %}

</div>

</body>
</html>
